<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- EVONIX Official SVG Logo (No 'Technologies' text, pure logo mark & wordmark) -->
  <defs>
    <style>
      .evonix-red { fill: #C81D25; }
      .evonix-char { fill: currentColor; }
    </style>
  </defs>

  <!-- Red Emblem Mark -->
  <g class="evonix-red">
    <!-- Main faceted delta ribbon -->
    <path d="M 14 8 L 8 18 L 38 66 L 46 66 L 56 46 L 47 46 L 42 56 L 20 20 L 51 20 L 54 13 L 57 8 Z" />
    <!-- Upper right floating triangular facet -->
    <path d="M 60 8 L 80 8 L 70 28 Z" />
  </g>

  <!-- Wordmark 'evonix' (pure SVG paths/glyphs) -->
  <g transform="translate(95, 52)">
    <!-- Letters 'evon' -->
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
      font-size="54"
      font-weight="900"
      letter-spacing="-2.5"
      fill="#0B0F19"
      class="evonix-char"
    >evon</text>

    <!-- Letter 'i' body -->
    <text
      x="122"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
      font-size="54"
      font-weight="900"
      letter-spacing="-2.5"
      fill="#0B0F19"
      class="evonix-char"
    >ı</text>

    <!-- Letter 'i' Red Circular Dot -->
    <circle cx="130" cy="-45" r="7" fill="#C81D25" />

    <!-- Letter 'x' base -->
    <text
      x="142"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
      font-size="54"
      font-weight="900"
      letter-spacing="-2.5"
      fill="#0B0F19"
      class="evonix-char"
    >x</text>

    <!-- Letter 'x' Red Top-Right Arm -->
    <polygon points="156,-19 170,-40 178,-40 162,-15" fill="#C81D25" />
  </g>
</svg>
