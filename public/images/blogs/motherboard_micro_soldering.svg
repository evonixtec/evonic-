<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Background Dark Lab -->
  <rect width="800" height="480" fill="#090d16" />
  <circle cx="400" cy="220" r="230" fill="#10b981" opacity="0.08" />

  <!-- PCB Board Simulation -->
  <g transform="translate(180, 80)">
    <rect width="440" height="250" rx="12" fill="url(#pcbGreen)" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    
    <!-- Copper PCB Traces -->
    <path d="M 20 40 L 100 40 L 140 80 L 220 80" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 20 60 L 90 60 L 120 90 L 160 90" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 20 180 L 120 180 L 180 120 L 260 120" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 300 60 L 360 60 L 400 100 L 400 180" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 280 200 L 340 200 L 380 160" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.8" />

    <!-- CPU Socket BGA Array -->
    <rect x="150" y="55" width="130" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="175" y="80" width="80" height="80" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="215" y="125" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">CPU BGA</text>

    <!-- MOSFET Power Phases (VCORE 19V Rail) -->
    <rect x="80" y="80" width="30" height="22" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <rect x="80" y="115" width="30" height="22" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="80" y="150" width="30" height="22" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="65" y="95" fill="#ef4444" font-family="monospace" font-size="9" font-weight="700">19V</text>

    <!-- Ceramic Capacitors -->
    <rect x="120" y="85" width="14" height="8" rx="2" fill="#d97706" />
    <rect x="120" y="120" width="14" height="8" rx="2" fill="#d97706" />
    <rect x="120" y="155" width="14" height="8" rx="2" fill="#d97706" />

    <!-- Multimeter Test Probes Pointing -->
    <line x1="85" y1="50" x2="95" y2="80" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <circle cx="95" cy="80" r="3" fill="#ef4444" />
    <line x1="125" y1="40" x2="127" y2="85" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <circle cx="127" cy="85" r="3" fill="#000000" />

    <!-- Status Readout Badge -->
    <rect x="290" y="70" width="130" height="60" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="300" y="90" fill="#94a3b8" font-family="monospace" font-size="9">RAIL: VCC_CORE</text>
    <text x="300" y="105" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">RES: 0.18 OHMS</text>
    <text x="300" y="120" fill="#10b981" font-family="sans-serif" font-size="9">STATUS: SHORT FIXED</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="280" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#10b981" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#10b981" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">CHIP-LEVEL MICRO-SOLDERING LAB</text>

  <!-- Watermark Logo (evonix technologies in small letters) -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#10b981" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Laptop &amp; Motherboard Chip-Level Diagnostics</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">19V Rail Short-Circuit Injection, BGA Rework &amp; Precision Micro-Soldering in Sialkot</text>
  <text x="760" y="445" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix hardware lab</text>
</svg>
