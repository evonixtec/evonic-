      <text x="215" y="130" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">REQUEST RFQ</text>

      <rect x="265" y="115" width="95" height="22" rx="6" fill="#0f172a" stroke="#10b981" />
