      <circle cx="85" cy="80" r="35" fill="none" stroke="#6366f1" stroke-width="2" />
      <path d="M 60 80 Q 85 55 110 80 T 110 100" stroke="#a855f7" stroke-width="2" fill="none" />
      <text x="85" y="140" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">SURGICAL / LEATHER CATALOG</text>

      <!-- Right side: Content & Action -->
      <text x="175" y="35" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800">Custom B2B Exporter Website</text>
      <text x="175" y="52" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700">React 19 + Vite • 100/100 PageSpeed</text>
      
      <rect x="175" y="68" width="190" height="6" rx="3" fill="#334155" />
      <rect x="175" y="80" width="160" height="6" rx="3" fill="#334155" />
      <rect x="175" y="92" width="180" height="6" rx="3" fill="#334155" />

      <!-- Badges -->
