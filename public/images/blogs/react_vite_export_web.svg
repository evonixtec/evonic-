  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#7c3aed" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Modern B2B Export Web Portals &amp; UI/UX Design</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">High-Conversion Sialkot Exporter Websites, React + Vite SPAs &amp; Google SEO Schema</text>
  <text x="760" y="445" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix web desk</text>
