    <circle cx="20" cy="15" r="4" fill="#ef4444" />
    <circle cx="35" cy="15" r="4" fill="#f59e0b" />
    <circle cx="50" cy="15" r="4" fill="#10b981" />
    <rect x="75" y="6" width="280" height="18" rx="6" fill="#0f172a" />
    <text x="215" y="19" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">https://sialkot-export-portal.com</text>

    <!-- Web Page Hero Simulation -->
    <g transform="translate(25, 45)">
