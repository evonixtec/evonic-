<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0f172a" />
  <circle cx="400" cy="220" r="230" fill="#f97316" opacity="0.08" />

  <!-- Laser Printer Fuser & Pickup Assembly Schematic -->
  <g transform="translate(180, 85)">
    <!-- Chassis outline -->
    <rect width="440" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Paper Path -->
    <path d="M 40 180 Q 140 180 200 130 T 400 120" stroke="#f8fafc" stroke-width="6" stroke-dasharray="10 5" fill="none" />
    <text x="50" y="205" fill="#94a3b8" font-family="sans-serif" font-size="10">80 GSM BOND PAPER INTAKE</text>

    <!-- Pickup Roller Rubber -->
    <circle cx="110" cy="150" r="30" fill="#334155" stroke="#f59e0b" stroke-width="3" />
    <circle cx="110" cy="150" r="14" fill="#0f172a" />
    <text x="110" y="200" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">PICKUP ROLLER</text>

    <!-- Separation Pad -->
    <rect x="90" y="185" width="40" height="8" rx="2" fill="#d97706" />

    <!-- Fuser Heating Roller (Orange Glow) -->
    <circle cx="280" cy="115" r="45" fill="url(#heatGlow)" stroke="#f97316" stroke-width="3" filter="drop-shadow(0 0 15px rgba(249, 115, 22, 0.4))" />
    <circle cx="280" cy="115" r="32" fill="#7c2d12" />
    <text x="280" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">180°C FUSER</text>

    <!-- Lower Pressure Roller -->
    <circle cx="280" cy="190" r="35" fill="#475569" stroke="#64748b" stroke-width="2" />
    <circle cx="280" cy="190" r="15" fill="#1e293b" />
    <text x="280" y="240" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">PRESSURE ROLLER</text>

    <!-- Technical Specs Box -->
    <rect x="330" y="40" width="90" height="55" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="340" y="58" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700">HP LASERJET</text>
    <text x="340" y="72" fill="#f8fafc" font-family="sans-serif" font-size="8">TEFLON SLEEVE</text>
    <text x="340" y="86" fill="#10b981" font-family="sans-serif" font-size="8">GREASE OEM OK</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="280" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#f97316" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#f97316" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">PRINTER HARDWARE WORKSHOP</text>

  <!-- Watermark Logo (evonix technologies in small letters) -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#f97316" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Laser &amp; Thermal Printer Repair Workshop</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">HP LaserJet Paper Jam Resolution, Fuser Film Replacement &amp; Canon Printhead Cleans</text>
  <text x="760" y="445" fill="#f97316" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix repair desk</text>
</svg>
