<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_barcode_studio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_barcode_studio)" />
  <circle cx="400" cy="220" r="240" fill="#dc2626" opacity="0.08" />

  <!-- Thermal Shipping Carton Label Frame (White Paper) -->
  <g transform="translate(240, 90)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.3))" />
    
    <!-- Label Header Box -->
    <rect x="15" y="15" width="290" height="35" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="25" y="32" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="800">EXP-PK-SIALKOT // CARGO</text>
    <text x="25" y="44" fill="#64748b" font-family="sans-serif" font-size="8">DESTINATION: HAMBURG / DUBAI</text>
    <text x="295" y="36" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="end">PRIORITY AIR</text>

    <!-- Barcode Lines (Code128 / GS1) -->
    <g transform="translate(30, 65)">
      <!-- Alternating bars -->
      <rect x="0" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="6" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="15" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="20" y="0" width="8" height="70" fill="#0f172a" />
      <rect x="32" y="0" width="4" height="70" fill="#0f172a" />
      <rect x="40" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="46" y="0" width="7" height="70" fill="#0f172a" />
      <rect x="56" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="63" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="73" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="78" y="0" width="9" height="70" fill="#0f172a" />
      <rect x="91" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="98" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="108" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="114" y="0" width="8" height="70" fill="#0f172a" />
      <rect x="126" y="0" width="4" height="70" fill="#0f172a" />
      <rect x="134" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="140" y="0" width="7" height="70" fill="#0f172a" />
      <rect x="151" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="158" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="168" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="174" y="0" width="9" height="70" fill="#0f172a" />
      <rect x="187" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="194" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="204" y="0" width="4" height="70" fill="#0f172a" />
      <rect x="212" y="0" width="8" height="70" fill="#0f172a" />
      <rect x="224" y="0" width="3" height="70" fill="#0f172a" />
      <rect x="231" y="0" width="6" height="70" fill="#0f172a" />
      <rect x="241" y="0" width="2" height="70" fill="#0f172a" />
      <rect x="247" y="0" width="8" height="70" fill="#0f172a" />

      <!-- Human Readable Code Text -->
      <text x="130" y="85" fill="#334155" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3">(01) 95012345678903 (10) B492</text>
    </g>

    <!-- Laser Scanning Beam -->
    <rect x="10" y="100" width="300" height="2" fill="url(#laserBeam)" />
    <circle cx="160" cy="101" r="4" fill="#ef4444" opacity="0.6" />

    <!-- Label Sub-Details -->
    <line x1="15" y1="165" x2="305" y2="165" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="180" fill="#475569" font-family="sans-serif" font-size="9">PIECES: 250 PAIRS</text>
    <text x="25" y="195" fill="#475569" font-family="sans-serif" font-size="9">GROSS WT: 24.5 KG</text>
    <text x="295" y="180" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">CBM: 0.082 m³</text>
    <text x="295" y="195" fill="#059669" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="end">GS1 COMPLIANT</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="280" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#ef4444" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#ef4444" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">EXPORT BARCODE STUDIO • GS1-128</text>

  <!-- Watermark Logo (evonix technologies in small letters) -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#ef4444" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Thermal Shipping &amp; Carton Barcode Label Generator</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Direct Browser Barcode Printing for Sialkot Surgical, Leather &amp; Sports Consignments</text>
  <text x="760" y="445" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix export tools</text>
</svg>
