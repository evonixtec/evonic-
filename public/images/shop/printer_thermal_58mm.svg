<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_printer_thermal_58mm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="glow_printer_thermal_58mm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg_printer_thermal_58mm)" />

  <!-- Ambient Luxury Glow -->
  <circle cx="400" cy="220" r="230" fill="url(#glow_printer_thermal_58mm)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="550" y1="0" x2="550" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Printer Main Body -->
  <rect x="260" y="130" width="280" height="190" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="2.5" />
  <!-- Printer Output Slot -->
  <rect x="300" y="160" width="200" height="18" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
  <!-- Paper Receipt / Waybill outputting -->
  <rect x="320" y="140" width="160" height="40" fill="#ffffff" rx="2" />
  <line x1="330" y1="150" x2="450" y2="150" stroke="#cbd5e1" stroke-width="2" />
  <line x1="330" y1="160" x2="430" y2="160" stroke="#94a3b8" stroke-width="2" />
  <line x1="330" y1="170" x2="460" y2="170" stroke="#64748b" stroke-width="2" />

  <!-- Printer Control Panel -->
  <rect x="290" y="215" width="220" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="315" cy="247" r="8" fill="#10b981" />
  <text x="332" y="251" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">ONLINE • READY</text>
  <rect x="445" y="235" width="50" height="24" rx="4" fill="#dc2626" />
  <text x="470" y="251" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">FEED</text>

  <!-- Top Badges -->
  <rect x="40" y="32" width="210" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="#dc2626" stroke-width="1.5" />
  <circle cx="57" cy="49" r="5" fill="#dc2626" />
  <text x="72" y="54" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">20% BELOW MARKET RATE</text>

  <rect x="265" y="32" width="180" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.2" />
  <text x="355" y="54" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">SIALKOT LAB TESTED</text>

  <!-- Watermark Logo -->
  <text x="760" y="55" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">evonix technologies</text>

  <!-- Bottom Detailed Information Strip -->
  <rect x="0" y="390" width="800" height="90" fill="rgba(15, 23, 42, 0.95)" />
  <line x1="0" y1="390" x2="800" y2="390" stroke="#dc2626" stroke-width="2" />
  <text x="40" y="422" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Mini 58mm POS USB Thermal Printer</text>
  <text x="40" y="445" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">90mm/sec • Compact Billing</text>
  <text x="40" y="464" fill="#94a3b8" font-family="sans-serif" font-size="11">Direct Thermal • No Ink Needed • Windows & Android POS</text>
  
  <rect x="615" y="410" width="145" height="52" rx="10" fill="#dc2626" />
  <text x="687" y="432" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">DUBAI DIRECT</text>
  <text x="687" y="451" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle">20% OFF RATE</text>
</svg>