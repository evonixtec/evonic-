<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_laptop_asus_expertbook_b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="glow_laptop_asus_expertbook_b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg_laptop_asus_expertbook_b1)" />

  <!-- Ambient Luxury Glow -->
  <circle cx="400" cy="220" r="230" fill="url(#glow_laptop_asus_expertbook_b1)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="550" y1="0" x2="550" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Screen Housing -->
  <rect x="230" y="110" width="340" height="220" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="2.5" shadow="0 10 25px rgba(0,0,0,0.5)" />
  <!-- Display Panel -->
  <rect x="245" y="125" width="310" height="185" rx="6" fill="#020617" />
  
  <!-- Screen Internal Content Graphic -->
  <rect x="260" y="140" width="280" height="35" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
  <text x="275" y="162" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">ASUS PROFESSIONAL</text>
  <text x="520" y="162" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">PASSED 40-PT QA</text>
  
  <rect x="260" y="185" width="135" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="272" y="208" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">PROCESSOR / CPU</text>
  <text x="272" y="228" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">Core i5-1135G7</text>
  <text x="272" y="248" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">Dubai Direct Bench Tested</text>

  <rect x="405" y="185" width="135" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="417" y="208" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">HEALTH &amp; THERMAL</text>
  <text x="417" y="228" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="800">100% Original OEM</text>
  <text x="417" y="248" fill="#e2e8f0" font-family="sans-serif" font-size="10">Clean Thermal Paste</text>

  <!-- Laptop Base Chassis -->
  <path d="M 190 330 L 610 330 L 590 365 L 210 365 Z" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
  <rect x="350" y="338" width="100" height="16" rx="4" fill="#334155" />

  <!-- Top Badges -->
  <rect x="40" y="32" width="210" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="57" cy="49" r="5" fill="#0284c7" />
  <text x="72" y="54" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">20% BELOW MARKET RATE</text>

  <rect x="265" y="32" width="180" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.2" />
  <text x="355" y="54" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">SIALKOT LAB TESTED</text>

  <!-- Watermark Logo -->
  <text x="760" y="55" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">evonix technologies</text>

  <!-- Bottom Detailed Information Strip -->
  <rect x="0" y="390" width="800" height="90" fill="rgba(15, 23, 42, 0.95)" />
  <line x1="0" y1="390" x2="800" y2="390" stroke="#0284c7" stroke-width="2" />
  <text x="40" y="422" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Asus ExpertBook B1 Corporate</text>
  <text x="40" y="445" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Core i5-1135G7 (11th Gen)</text>
  <text x="40" y="464" fill="#94a3b8" font-family="sans-serif" font-size="11">16GB RAM • 512GB SSD • MIL-STD-810H Rugged</text>
  
  <rect x="615" y="410" width="145" height="52" rx="10" fill="#dc2626" />
  <text x="687" y="432" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">DUBAI DIRECT</text>
  <text x="687" y="451" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle">20% OFF RATE</text>
</svg>