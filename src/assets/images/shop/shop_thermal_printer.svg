      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_shop_thermal_printer)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="#2563eb" opacity="0.12" />

  <!-- Center Graphic -->
  <rect x="260" y="180" width="280" height="190" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
      <rect x="290" y="210" width="220" height="30" rx="6" fill="#1e293b" stroke="#60a5fa"/>
      <path d="M 320 210 L 320 150 L 460 150 L 460 210 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="340" y1="170" x2="440" y2="170" stroke="#94a3b8" stroke-width="2"/>
      <line x1="340" y1="185" x2="420" y2="185" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="300" cy="320" r="10" fill="#10b981"/>
      <circle cx="330" cy="320" r="10" fill="#ef4444"/>

  <!-- Header Badge -->
  <rect x="40" y="35" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="#2563eb" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#2563eb" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">1.5M CUTS LIFESPAN</text>

