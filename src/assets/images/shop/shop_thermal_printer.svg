  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">80mm High-Speed Receipt Printer</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Heavy-Duty Auto-Cutter with USB &amp; LAN Networking</text>
  <text x="760" y="445" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">DUBAI HERITAGE • SIALKOT</text>
