<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_shop_laser_printer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_shop_laser_printer)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="#d97706" opacity="0.12" />

  <!-- Center Graphic -->
  <rect x="250" y="190" width="300" height="170" rx="14" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
      <path d="M 300 190 L 300 140 L 500 140 L 500 190 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="290" y="320" width="220" height="30" rx="6" fill="#1c1917" stroke="#78716c"/>
      <circle cx="280" cy="240" r="8" fill="#10b981"/>
      <circle cx="310" cy="240" r="8" fill="#3b82f6"/>

  <!-- Header Badge -->
  <rect x="40" y="35" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="#d97706" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#d97706" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">HIGH-YIELD PAPER ENGINE</text>

  <!-- Watermark Logo -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">EVONIX TECHNOLOGIES</text>

  <!-- Footer Information Strip -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.85)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#d97706" stroke-width="2" opacity="0.8"/>
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">HP / Canon Office Laser Printer</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Crisp Double-Sided Duplex Printing with Network Sharing</text>
  <text x="760" y="445" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">DUBAI HERITAGE • SIALKOT</text>
</svg>