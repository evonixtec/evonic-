<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_shop_thermal_paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_shop_thermal_paper)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="#6366f1" opacity="0.12" />

  <!-- Center Graphic -->
  <ellipse cx="330" cy="240" rx="50" ry="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <ellipse cx="450" cy="240" rx="50" ry="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <ellipse cx="330" cy="240" rx="16" ry="25" fill="#0f172a"/>
      <ellipse cx="450" cy="240" rx="16" ry="25" fill="#0f172a"/>
      <text x="315" y="370" fill="#c7d2fe" font-family="sans-serif" font-size="14" font-weight="bold">80x70mm &amp; 80x80mm</text>

  <!-- Header Badge -->
  <rect x="40" y="35" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#6366f1" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">WHOLESALE BOX PACK</text>

  <!-- Watermark Logo -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">EVONIX TECHNOLOGIES</text>

  <!-- Footer Information Strip -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.85)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Premium Thermal Paper Rolls (80mm &amp; 57mm)</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">BPA-Free Pure White Rolls with High Black Contrast</text>
  <text x="760" y="445" fill="#6366f1" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">DUBAI HERITAGE • SIALKOT</text>
</svg>