<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg_shop_barcode_scanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062017" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_shop_barcode_scanner)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="#059669" opacity="0.12" />

  <!-- Center Graphic -->
  <path d="M 350 380 L 450 380 L 430 260 L 370 260 Z" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <rect x="340" y="160" width="120" height="110" rx="20" fill="#042f2e" stroke="#34d399" stroke-width="3"/>
      <rect x="360" y="180" width="80" height="70" rx="10" fill="#022c22"/>
      <line x1="340" y1="215" x2="460" y2="215" stroke="#ef4444" stroke-width="4"/>
      <circle cx="400" cy="215" r="15" fill="#ef4444" opacity="0.3"/>

  <!-- Header Badge -->
  <rect x="40" y="35" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="#059669" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#059669" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">QR &amp; DIGITAL BARCODE READY</text>

  <!-- Watermark Logo -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">EVONIX TECHNOLOGIES</text>

  <!-- Footer Information Strip -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.85)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#059669" stroke-width="2" opacity="0.8"/>
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">2D &amp; 1D Hands-Free Barcode Scanner</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">High-Speed Omnidirectional Desktop Presentation Scanner</text>
  <text x="760" y="445" fill="#059669" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">DUBAI HERITAGE • SIALKOT</text>
</svg>