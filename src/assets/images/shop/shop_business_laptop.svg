  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Dell / HP Business Series Laptop</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Intel Core i5/i7, 16GB RAM, Fast NVMe SSD &amp; Grade-A Body</text>
  <text x="760" y="445" fill="#4f46e5" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">DUBAI HERITAGE • SIALKOT</text>
