      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_shop_business_laptop)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="220" fill="#4f46e5" opacity="0.12" />

  <!-- Center Graphic -->
  <rect x="250" y="150" width="300" height="190" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
      <rect x="270" y="170" width="260" height="150" rx="6" fill="#1e1b4b"/>
      <path d="M 210 340 L 590 340 L 570 370 L 230 370 Z" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
      <rect x="370" y="348" width="60" height="12" rx="3" fill="#4338ca"/>

  <!-- Header Badge -->
  <rect x="40" y="35" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="#4f46e5" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#4f46e5" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">UAE CORPORATE IMPORT</text>

