<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#090d16" />
  <circle cx="400" cy="220" r="230" fill="#2563eb" opacity="0.08" />

  <!-- Retail POS & Offline Sync Architecture -->
  <g transform="translate(180, 80)">
    <!-- Main Frame -->
    <rect width="440" height="250" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="2" />

    <!-- POS Screen Frame -->
    <rect x="30" y="30" width="220" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Screen Header -->
    <rect x="30" y="30" width="220" height="24" rx="8" fill="#0284c7" />
    <text x="40" y="46" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">RETAIL POS BILLING v4.2</text>
    <circle cx="235" cy="42" r="4" fill="#10b981" />

    <!-- Screen Items Table -->
    <text x="40" y="70" fill="#94a3b8" font-family="monospace" font-size="9">BARCODE: 890123456</text>
    <text x="40" y="88" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">1x Sports Kit Bag</text>
    <text x="235" y="88" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">PKR 4,850</text>
    
    <text x="40" y="105" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">2x Football Match Balls</text>
    <text x="235" y="105" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">PKR 7,600</text>

    <line x1="40" y1="120" x2="235" y2="120" stroke="#334155" />
    <text x="40" y="138" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800">TOTAL BILL</text>
    <text x="235" y="138" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="900" text-anchor="end">PKR 12,450</text>

    <!-- Cash Drawer & Stand -->
    <path d="M 120 180 L 160 180 L 170 215 L 110 215 Z" fill="#334155" />
    <rect x="70" y="215" width="140" height="15" rx="3" fill="#1e293b" stroke="#475569" />

    <!-- Right Side: Cloud & Offline Database Node -->
    <g transform="translate(280, 40)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="25" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">OFFLINE-FIRST DB</text>
      <text x="65" y="42" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">SQLite / IndexedDB</text>
      <text x="65" y="54" fill="#38bdf8" font-family="sans-serif" font-size="8" text-anchor="middle">Zero Internet Delay</text>
    </g>

    <!-- Cloud Sync Node -->
    <g transform="translate(280, 130)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="65" y="25" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">CLOUD SYNC</text>
      <text x="65" y="42" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">PostgreSQL / Redis</text>
      <text x="65" y="54" fill="#10b981" font-family="sans-serif" font-size="8" text-anchor="middle">Auto-Reconcile On LAN</text>
    </g>

    <line x1="250" y1="70" x2="280" y2="70" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="250" y1="160" x2="280" y2="160" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2" />
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="280" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#2563eb" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#2563eb" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">RETAIL POS &amp; ERP SOFTWARE</text>

  <!-- Watermark Logo (evonix technologies in small letters) -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#2563eb" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Offline-First Retail POS &amp; Supermarket Billing Systems</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Barcode Scanning, Thermal Receipt Printing, Offline Sync &amp; Multi-Counter ERP</text>
  <text x="760" y="445" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix software dev</text>
</svg>
