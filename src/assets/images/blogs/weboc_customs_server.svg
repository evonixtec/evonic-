<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="serverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#070c18" />
  <circle cx="400" cy="220" r="230" fill="#0284c7" opacity="0.08" />

  <!-- Sialkot WeBOC Customs Server Rack -->
  <g transform="translate(180, 80)">
    <!-- Server Rack Cabinet -->
    <rect width="440" height="250" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    
    <!-- Server Units (U1 to U4) -->
    <g transform="translate(25, 25)">
      <!-- U1: WeBOC Gateway Firewall -->
      <rect width="390" height="45" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="22" r="5" fill="#10b981" />
      <circle cx="40" cy="22" r="5" fill="#10b981" />
      <text x="60" y="27" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">WEBOC CUSTOMS VPN GATEWAY</text>
      <text x="375" y="27" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="end">SAMBRIAL DRY PORT OK</text>
    </g>

    <g transform="translate(25, 80)">
      <!-- U2: Export Database Server -->
      <rect width="390" height="45" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="22" r="5" fill="#10b981" />
      <circle cx="40" cy="22" r="5" fill="#38bdf8" />
      <text x="60" y="27" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">SIALKOT EXPORT ERP &amp; MANIFEST DB</text>
      <text x="375" y="27" fill="#10b981" font-family="monospace" font-size="10" text-anchor="end">RAID 10 ACTIVE</text>
    </g>

    <g transform="translate(25, 135)">
      <!-- U3: 24-Port Cat6 Gigabit LAN Switch -->
      <rect width="390" height="45" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="22" r="5" fill="#10b981" />
      <!-- LAN Port indicators -->
      <g transform="translate(60, 16)">
        <circle cx="10" cy="6" r="3" fill="#10b981" />
        <circle cx="25" cy="6" r="3" fill="#10b981" />
        <circle cx="40" cy="6" r="3" fill="#10b981" />
        <circle cx="55" cy="6" r="3" fill="#10b981" />
        <circle cx="70" cy="6" r="3" fill="#10b981" />
        <circle cx="85" cy="6" r="3" fill="#10b981" />
        <circle cx="100" cy="6" r="3" fill="#10b981" />
        <circle cx="115" cy="6" r="3" fill="#10b981" />
        <circle cx="130" cy="6" r="3" fill="#10b981" />
        <circle cx="145" cy="6" r="3" fill="#10b981" />
      </g>
      <text x="375" y="27" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="end">FIBER 10G UPLINK</text>
    </g>

    <g transform="translate(25, 190)">
      <!-- U4: Online UPS & Power Management -->
      <rect width="390" height="40" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="20" r="5" fill="#10b981" />
      <text x="60" y="25" fill="#94a3b8" font-family="monospace" font-size="10">ONLINE SINE-WAVE UPS // ZERO TRANSFER DELAY</text>
      <text x="375" y="25" fill="#10b981" font-family="monospace" font-size="10" text-anchor="end">230V STABLE</text>
    </g>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="280" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="56" cy="51" r="5" fill="#0284c7" />
  <text x="70" y="56" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">WEBOC &amp; EXPORT NETWORK HUB</text>

  <!-- Watermark Logo (evonix technologies in small letters) -->
  <text x="760" y="56" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">evonix technologies</text>

  <!-- Bottom Information Bar -->
  <rect x="0" y="405" width="800" height="75" fill="rgba(15, 23, 42, 0.9)" />
  <line x1="0" y1="405" x2="800" y2="405" stroke="#0284c7" stroke-width="2" />
  <text x="40" y="435" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Sialkot WeBOC Customs &amp; Export Server Maintenance</text>
  <text x="40" y="458" fill="#94a3b8" font-family="sans-serif" font-size="12">Fiber Optic LAN Infrastructure, Generator Switchover Protection &amp; Dry Port Customs IT</text>
  <text x="760" y="445" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">evonix enterprise IT</text>
</svg>
